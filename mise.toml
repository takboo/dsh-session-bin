min_version = "2026.10.2"

[env]
PLAYWRIGHT_BROWSERS_PATH = "{{config_root}}/.local/browsers"
pnpm_config_store_dir = "{{config_root}}/.local/pnpm-store"
pnpm_config_cache_dir = "{{config_root}}/.local/pnpm-cache"
pnpm_config_enable_global_virtual_store = "false"
# Fail on dependency drift; only the explicit frozen install task may refresh it.
pnpm_config_verify_deps_before_run = "error"
DSH_ENGINEERING_ACTIVE_RUN_DIR = '{% set _d = get_env(name="DSH_ENGINEERING_RUN_DIR", default="") %}{% if _d != "" %}{{ _d }}{% else %}{{ config_root }}/.local/engineering/run-{{ get_random(start=100000000, end=999999999) }}-{{ get_random(start=100000000, end=999999999) }}{% endif %}'

[tool_alias]
# The npm distribution also supports macOS Intel, unlike pnpm's standalone assets.
pnpm = "npm:pnpm"

[tools]
node = "24.18.1"
# Includes the worker shutdown fix for installs that print Done but never exit.
pnpm = "11.23.0"
gh = "2.102.0"

[tasks.env]
description = "Show the pinned development tool versions"
run = ["node --version", "pnpm --version", "gh --version"]

[tasks.install]
description = "Install locked project dependencies without lifecycle scripts"
run = "pnpm install --frozen-lockfile --ignore-scripts"

[tasks.setup]
description = "Install locked project dependencies without lifecycle scripts"
depends = ["install"]

[tasks."check:shell"]
description = "Check unified v0.2+ plugin shell and EGM documentation against the locked base"
run = 'node "${DSH_ENGINEERING_CHECKOUT:-../dsh-plugin-engineering}/scripts/locked-run.mjs" check-plugin'

[tasks."check:types"]
description = "Check Host and Client types against the pinned SDK"
run = "pnpm run check"

[tasks.check]
description = "Run unified shell, docs, market, and Host/Client type checks"
depends = ["check:shell", "verify:docs", "verify:market", "check:types"]

[tasks.build]
description = "Build precompiled Host and Client artifacts and declarations"
run = "pnpm run build"

[tasks.test]
description = "Test lifecycle behavior in isolated DSH data"
depends = ["build"]
run = "pnpm run test"

[tasks."verify:package"]
description = "Verify the tarball with the real Cordis Loader"
depends = ["build"]
run = "pnpm run verify:package"

[tasks.verify]
description = "Check, build, test, and verify the Host and Client tarball"
run = "pnpm run verify"

[tasks."verify:market"]
description = "Check the dshmarket entry, npm repository, bundle, and screenshot paths offline"
run = "pnpm run verify:market"

[tasks."verify:linux"]
description = "Verify Linux in an isolated pinned Node container and preserve native evidence"
run = "pnpm run verify:linux"

[tasks."verify:platform"]
description = "Verify the actual OS with an isolated candidate composition and source evidence"
run = "pnpm run verify:platform"

[tasks."verify:gui:browser"]
description = "Install the pinned test Chromium and OS libraries on an isolated CI runner"
run = "pnpm run verify:gui:browser"

[tasks."verify:gui"]
description = "Verify Chinese and English isolated Web profiles sequentially"
depends = ["build"]
run = "pnpm run verify:gui"

[tasks."verify:gui:locale"]
description = "Verify one locale from DSH_GUI_LOCALE for diagnosis"
depends = ["build"]
run = "pnpm run verify:gui:locale"

[tasks."release:check"]
description = "Check a release tag against package version, triggering commit, and main"
run = "node scripts/release.mjs check-tag"

[tasks."release:prepare"]
description = "Copy the identical Loader and bilingual GUI verified tarball on a clean CI runner"
run = "node scripts/release.mjs prepare"

[tasks."release:verify"]
description = "Verify a downloaded release payload against its tag and commit"
run = "node scripts/release.mjs check-artifact"

[tasks."verify:desktop"]
description = "Verify the installed macOS ARM64 Electron runtime and real ASAR Host SDK on isolated sessions"
depends = ["build"]
run = "pnpm run verify:desktop"

[tasks."verify:desktop:gui"]
description = "Verify bilingual isolated Web profiles on the installed Desktop Electron carrier"
depends = ["build"]
run = "pnpm run verify:desktop:gui"

[tasks."compat:discover"]
description = "Discover exact new DSH releases and existing compatibility Issues"
run = "node scripts/compatibility/discover.mjs"

[tasks."compat:check"]
description = "Check an exact SDK on isolated sessions without changing production admission"
run = "pnpm run compat:check"

[tasks."compat:report"]
description = "Maintain compatibility Issues and draft dependency proposals"
run = "node scripts/compatibility/report.mjs"

[tasks."compat:desktop"]
description = "Verify an official signed macOS ARM64 Desktop on isolated candidate sessions"
run = "pnpm run compat:desktop"

[tasks."verify:docs"]
description = "Check current document links and anchors"
run = "pnpm run verify:docs"

[tasks."verify:pack"]
description = "Build from clean HEAD archive, E1-verify the candidate tarball, and bundle the Web probe"
run = "pnpm run verify:pack"

[tasks."verify:host:container"]
description = "Run the locked Linux host container (CLI + Web) against the verified candidate"
depends = ["verify:pack"]
run = 'node "${DSH_ENGINEERING_CHECKOUT:-../dsh-plugin-engineering}/scripts/locked-run.mjs" container all "${DSH_ENGINEERING_ACTIVE_RUN_DIR}/targets.json" "${DSH_ENGINEERING_ACTIVE_RUN_DIR}/probe.mjs" "${DSH_ENGINEERING_ACTIVE_RUN_DIR}/candidate.tgz" HEAD "${DSH_ENGINEERING_ACTIVE_RUN_DIR}/host-report.json"'

[tasks."verify:host"]
description = "Verify E1-to-E2 candidate provenance and host container report"
depends = ["verify:host:container"]
run = "node scripts/engineering/pack-host.mjs --verify-report"
