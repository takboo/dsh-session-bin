[env]
PLAYWRIGHT_BROWSERS_PATH = "{{config_root}}/.local/browsers"
pnpm_config_store_dir = "{{config_root}}/.local/pnpm-store"
pnpm_config_cache_dir = "{{config_root}}/.local/pnpm-cache"
pnpm_config_enable_global_virtual_store = "false"
# Fail on dependency drift; only the explicit frozen install task may refresh it.
pnpm_config_verify_deps_before_run = "error"

[tool_alias]
# The npm distribution also supports macOS Intel, unlike pnpm's standalone assets.
pnpm = "npm:pnpm"

[tools]
node = "24.18.1"
# Includes the worker shutdown fix for installs that print Done but never exit.
pnpm = "11.23.0"
gh = "2.102.0"

[tasks.env]
description = "Show the pinned development tool versions"
run = ["node --version", "pnpm --version", "gh --version"]

[tasks.install]
description = "Install locked project dependencies without lifecycle scripts"
run = "pnpm install --frozen-lockfile --ignore-scripts"

[tasks.check]
description = "Check Host and Client types against the pinned SDK"
run = "pnpm run check"

[tasks.build]
description = "Build precompiled Host and Client artifacts and declarations"
run = "pnpm run build"

[tasks.test]
description = "Test lifecycle behavior in isolated DSH data"
depends = ["build"]
run = "pnpm run test"

[tasks."verify:package"]
description = "Verify the tarball with the real Cordis Loader"
depends = ["build"]
run = "pnpm run verify:package"

[tasks.verify]
description = "Check, build, test, and verify the Host and Client tarball"
run = "pnpm run verify"

[tasks."verify:linux"]
description = "Verify Linux in an isolated pinned Node container and preserve native evidence"
run = "pnpm run verify:linux"

[tasks."verify:platform"]
description = "Verify the actual OS with an isolated candidate composition and source evidence"
run = "pnpm run verify:platform"

[tasks."verify:gui:browser"]
description = "Install the pinned test Chromium and OS libraries on an isolated CI runner"
run = "pnpm run verify:gui:browser"

[tasks."verify:gui"]
description = "Verify Chinese and English isolated Web profiles sequentially"
depends = ["build"]
run = "pnpm run verify:gui"

[tasks."verify:gui:locale"]
description = "Verify one locale from DSH_GUI_LOCALE for diagnosis"
depends = ["build"]
run = "pnpm run verify:gui:locale"

[tasks."release:check"]
description = "Check a release tag against package version, triggering commit, and main"
run = "node scripts/release.mjs check-tag"

[tasks."release:prepare"]
description = "Copy the identical Loader and bilingual GUI verified tarball on a clean CI runner"
run = "node scripts/release.mjs prepare"

[tasks."release:verify"]
description = "Verify a downloaded release payload against its tag and commit"
run = "node scripts/release.mjs check-artifact"
