name: Startup handshake diagnosis
on:
  push:
permissions:
  contents: read
jobs:
  diagnose:
    name: ${{ matrix.os }} / proxy-${{ matrix.proxy }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        proxy: ["on", "off"]
    env:
      DSH_DIAG_WS_ROUTE: ${{ matrix.proxy }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: mise run install
      - run: mise run build
      - run: mise run verify:gui:browser
      - name: Repeat isolated real startup with protocol timing
        run: mise exec -- pnpm run diagnose:startup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-${{ matrix.os }}-${{ matrix.proxy }}
          path: |
            .local/startup-diagnosis/
            .local/gui/**/verification.json
            .local/gui/**/artifacts/*.png
