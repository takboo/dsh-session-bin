name: Repeated exact Windows GUI diagnosis
on:
  push:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      DSH_VERIFY_PLATFORM: win32
      DSH_VERIFY_ARCH: x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - run: mise run install
      - run: mise run verify:platform
      - run: mise run verify:gui:browser
      - name: Repeat the exact bilingual GUI task until the first failure
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $results = @()
          $failure = 0
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            & mise run verify:gui
            $code = $LASTEXITCODE
            $results += [pscustomobject]@{attempt=$attempt; exitCode=$code; recordedAtUtc=[DateTime]::UtcNow.ToString('o')}
            ConvertTo-Json -InputObject @($results) | Set-Content .local/gui-diagnostic-attempts.json
            if ($code -ne 0) { $failure = $code; break }
          }
          exit $failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repeated-exact-windows-gui
          path: |
            .local/gui-diagnostic-attempts.json
            .local/platform/**/verification.json
            .local/lifecycle/package-*/verification.json
            .local/gui/**/verification.json
            .local/gui/**/artifacts/*.png
