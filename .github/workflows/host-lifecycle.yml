name: Intel GUI diagnosis
on:
  push:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: mise run install
      - run: mise run build
      - name: Record GUI-only resource state
        run: |
          sysctl -n hw.logicalcpu
          uptime
          ps -axo pid,ppid,%cpu,etime,comm | rg '(PID|node|Chrom|chrome|DeepSeek)'
      - run: mise run verify:gui:browser
      - run: mise run verify:gui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-gui-diagnosis
          path: |
            .local/gui/**/verification.json
            .local/gui/**/artifacts/*.png
